plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.airtribe'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
	mockitoAgent
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.testcontainers:junit-jupiter:1.19.3'
	testImplementation 'org.testcontainers:postgresql:1.19.3'
	mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.withType(Test).configureEach { testTask ->
	testTask.jvmArgumentProviders.add(
			{ ["-javaagent:${configurations.mockitoAgent.asPath}".toString()] } as CommandLineArgumentProvider)
}

// Fast tests (no Docker): controller slice, service/strategy/util unit tests.
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'docker'
	}
}

// Tests that start a real Postgres via Testcontainers (repository + integration). Requires Docker.
tasks.register('dockerTest', Test) {
	description = 'Runs tests tagged "docker" (repository and integration tests).'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'docker'
	}
	shouldRunAfter tasks.named('test')
}

tasks.register('allTests') {
	description = 'Runs fast tests and Docker-backed tests.'
	group = 'verification'
	dependsOn tasks.named('test'), tasks.named('dockerTest')
}
